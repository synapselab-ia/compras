name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compras_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compras_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: compras_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify 0001 default-deny foundation
        run: |
          psql -v ON_ERROR_STOP=1 -f database/migrations/0001_core_foundation.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/core_foundation.sql
          psql -v ON_ERROR_STOP=1 -f database/tests/scope_integrity_red_team.sql

      - name: Verify 0001 + 0002 trusted read policies
        run: |
          createdb compras_read_ci
          PGDATABASE=compras_read_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0001_core_foundation.sql
          PGDATABASE=compras_read_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0002_trusted_identity_read_policies.sql
          PGDATABASE=compras_read_ci psql -v ON_ERROR_STOP=1 -f database/tests/trusted_identity_read_policies.sql
          PGDATABASE=compras_read_ci psql -v ON_ERROR_STOP=1 -f database/tests/trusted_identity_read_red_team.sql
          PGDATABASE=compras_read_ci psql -v ON_ERROR_STOP=1 -f database/tests/trusted_server_context_transport.sql

      - name: Verify F10 team directory RLS design
        run: |
          createdb compras_directory_design_ci
          PGDATABASE=compras_directory_design_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0001_core_foundation.sql
          PGDATABASE=compras_directory_design_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0002_trusted_identity_read_policies.sql
          PGDATABASE=compras_directory_design_ci psql -v ON_ERROR_STOP=1 -f database/tests/team_directory_rls_design.sql

      - name: Red-team F11 capability migration preflight
        run: |
          createdb compras_directory_preflight_ci
          PGDATABASE=compras_directory_preflight_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0001_core_foundation.sql
          PGDATABASE=compras_directory_preflight_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0002_trusted_identity_read_policies.sql

          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_team_directory_view_owner LOGIN;"
          if PGDATABASE=compras_directory_preflight_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0003_team_member_directory.sql; then
            echo "unsafe LOGIN capability was accepted" >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE compras_team_directory_view_owner;"

          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_team_directory_view_owner NOLOGIN BYPASSRLS;"
          if PGDATABASE=compras_directory_preflight_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0003_team_member_directory.sql; then
            echo "unsafe BYPASSRLS capability was accepted" >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE compras_team_directory_view_owner;"

          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_team_directory_view_owner NOLOGIN NOINHERIT NOBYPASSRLS;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_directory_preflight_member NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "GRANT compras_team_directory_view_owner TO compras_directory_preflight_member WITH INHERIT FALSE, SET TRUE;"
          if PGDATABASE=compras_directory_preflight_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0003_team_member_directory.sql; then
            echo "SET-capable capability membership was accepted" >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -d postgres -c "REVOKE compras_team_directory_view_owner FROM compras_directory_preflight_member;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE compras_directory_preflight_member;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE compras_team_directory_view_owner;"
          dropdb compras_directory_preflight_ci

      - name: Verify 0001 + 0002 + 0003 team directory capability
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_migrator_ci LOGIN CREATEROLE NOINHERIT PASSWORD 'DEMO-F11-MIGRATOR-PASSWORD';"
          createdb -O compras_migrator_ci compras_directory_ci

          PGUSER=compras_migrator_ci PGPASSWORD='DEMO-F11-MIGRATOR-PASSWORD' PGDATABASE=compras_directory_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0001_core_foundation.sql
          PGUSER=compras_migrator_ci PGPASSWORD='DEMO-F11-MIGRATOR-PASSWORD' PGDATABASE=compras_directory_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0002_trusted_identity_read_policies.sql
          PGUSER=compras_migrator_ci PGPASSWORD='DEMO-F11-MIGRATOR-PASSWORD' PGDATABASE=compras_directory_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0003_team_member_directory.sql
          PGDATABASE=compras_directory_ci psql -v ON_ERROR_STOP=1 -f database/tests/team_member_directory.sql

          createdb -O compras_migrator_ci compras_directory_reuse_ci
          PGUSER=compras_migrator_ci PGPASSWORD='DEMO-F11-MIGRATOR-PASSWORD' PGDATABASE=compras_directory_reuse_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0001_core_foundation.sql
          PGUSER=compras_migrator_ci PGPASSWORD='DEMO-F11-MIGRATOR-PASSWORD' PGDATABASE=compras_directory_reuse_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0002_trusted_identity_read_policies.sql
          PGUSER=compras_migrator_ci PGPASSWORD='DEMO-F11-MIGRATOR-PASSWORD' PGDATABASE=compras_directory_reuse_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0003_team_member_directory.sql

          dropdb compras_directory_reuse_ci
          dropdb compras_directory_ci
          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE compras_team_directory_view_owner;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE compras_migrator_ci;"

      - name: Verify F12 protected contracting detail read
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_f12_migrator_ci LOGIN CREATEROLE NOINHERIT PASSWORD 'DEMO-F12-MIGRATOR-PASSWORD';"
          createdb -O compras_f12_migrator_ci compras_detail_ci

          PGUSER=compras_f12_migrator_ci PGPASSWORD='DEMO-F12-MIGRATOR-PASSWORD' PGDATABASE=compras_detail_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0001_core_foundation.sql
          PGUSER=compras_f12_migrator_ci PGPASSWORD='DEMO-F12-MIGRATOR-PASSWORD' PGDATABASE=compras_detail_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0002_trusted_identity_read_policies.sql
          PGUSER=compras_f12_migrator_ci PGPASSWORD='DEMO-F12-MIGRATOR-PASSWORD' PGDATABASE=compras_detail_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0003_team_member_directory.sql
          PGDATABASE=compras_detail_ci psql -v ON_ERROR_STOP=1 -f database/tests/persistent_contracting_detail_read.sql

          dropdb compras_detail_ci
          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE compras_team_directory_view_owner;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE compras_f12_migrator_ci;"

  auth-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Red-team unsafe Auth runtime role
        run: |
          createdb compras_auth_redteam_ci
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_auth_runtime LOGIN NOINHERIT BYPASSRLS PASSWORD 'F20-UNSAFE-RUNTIME-FICTITIOUS';"
          PGDATABASE=compras_auth_redteam_ci psql -v ON_ERROR_STOP=1 -f database/auth/migrations/0001_better_auth_1_6_23.sql

          if PGDATABASE=compras_auth_redteam_ci psql -v ON_ERROR_STOP=1 -f database/auth/migrations/0002_auth_runtime_boundary.sql; then
            echo "unsafe BYPASSRLS Auth runtime role was accepted" >&2
            exit 1
          fi

          dropdb compras_auth_redteam_ci
          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE compras_auth_runtime;"

      - name: Provision ephemeral separated Auth roles
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_auth_migrator_ci LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'F20-AUTH-MIGRATOR-FICTITIOUS';"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_auth_runtime LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'F20-AUTH-RUNTIME-FICTITIOUS';"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE compras_domain_runtime_ci LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'F20-DOMAIN-RUNTIME-FICTITIOUS';"
          createdb -O compras_auth_migrator_ci compras_auth_ci

          PGUSER=compras_auth_migrator_ci PGPASSWORD='F20-AUTH-MIGRATOR-FICTITIOUS' PGDATABASE=compras_auth_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0001_core_foundation.sql
          PGUSER=compras_auth_migrator_ci PGPASSWORD='F20-AUTH-MIGRATOR-FICTITIOUS' PGDATABASE=compras_auth_ci psql -v ON_ERROR_STOP=1 -f database/auth/migrations/0001_better_auth_1_6_23.sql
          PGUSER=compras_auth_migrator_ci PGPASSWORD='F20-AUTH-MIGRATOR-FICTITIOUS' PGDATABASE=compras_auth_ci psql -v ON_ERROR_STOP=1 -f database/auth/migrations/0002_auth_runtime_boundary.sql

      - name: Verify Better Auth PostgreSQL boundary
        env:
          F20_AUTH_POSTGRES_TEST: "1"
          AUTH_INTEGRATION_DATABASE_URL: postgresql://compras_auth_runtime:F20-AUTH-RUNTIME-FICTITIOUS@localhost:5432/compras_auth_ci
          AUTH_INTEGRATION_DOMAIN_DATABASE_URL: postgresql://compras_domain_runtime_ci:F20-DOMAIN-RUNTIME-FICTITIOUS@localhost:5432/compras_auth_ci
          AUTH_INTEGRATION_SUPERUSER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/compras_auth_ci
        run: npx vitest run src/server/auth/postgres-integration.test.ts
