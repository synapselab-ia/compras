name: Temporary F08 lockfile refresh

on:
  push:
    branches:
      - f08-server-trust-adapter

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Refresh lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for F08"
          git push
