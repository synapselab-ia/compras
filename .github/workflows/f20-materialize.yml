name: F20 materialize lock and auth schema

on:
  push:
    branches:
      - f20-self-hosted-auth-implement

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compras_auth_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compras_auth_schema"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: compras_auth_schema
      AUTH_SCHEMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/compras_auth_schema

    steps:
      - name: Checkout F20 branch
        uses: actions/checkout@v6
        with:
          ref: f20-self-hosted-auth-implement

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Materialize exact dependency lock
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Use PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Generate Better Auth 1.6.23 PostgreSQL schema
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA auth;'
          node --input-type=module <<'NODE'
          import { betterAuth } from "better-auth";
          import { getMigrations } from "better-auth/db/migration";
          import pg from "pg";

          const { Pool } = pg;
          const pool = new Pool({
            connectionString: process.env.AUTH_SCHEMA_DATABASE_URL,
            options: "-c search_path=auth",
          });

          try {
            const auth = betterAuth({
              database: pool,
              baseURL: "https://f20-schema.invalid",
              secret: "f20-fictitious-schema-generation-secret-000000000001",
              trustedOrigins: ["https://f20-schema.invalid"],
              emailAndPassword: {
                enabled: true,
                disableSignUp: true,
              },
              socialProviders: {},
              plugins: [],
            });
            const { runMigrations } = await getMigrations(auth.options);
            await runMigrations();
          } finally {
            await pool.end();
          }
          NODE

          mkdir -p database/auth/migrations
          tmp_file="$(mktemp)"
          /usr/lib/postgresql/17/bin/pg_dump --schema=auth --schema-only --no-owner --no-privileges --no-comments > "$tmp_file"
          {
            echo '-- Generated from better-auth@1.6.23 via getMigrations() against PostgreSQL 17.'
            echo '-- Do not edit after application; changes require a new Auth migration.'
            sed -e '/^\\restrict /d' -e '/^\\unrestrict /d' "$tmp_file"
          } > database/auth/migrations/0001_better_auth_1_6_23.sql
          rm -f "$tmp_file"

      - name: Commit generated material only
        run: |
          if git diff --quiet -- package-lock.json database/auth/migrations/0001_better_auth_1_6_23.sql; then
            echo 'Generated material is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json database/auth/migrations/0001_better_auth_1_6_23.sql
          git commit -m 'build: materialize F20 auth dependencies and schema'
          git push origin HEAD:f20-self-hosted-auth-implement
