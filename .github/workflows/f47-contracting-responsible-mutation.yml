name: F47 Contracting Responsible Mutation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  contracting-responsible-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify migrations 0001 through 0011 are immutable
        run: |
          set -euo pipefail
          declare -A expected=(
            [0001_core_foundation.sql]=a10e9733b71abae272fb58b763cae4c1439dd70c
            [0002_trusted_identity_read_policies.sql]=ba6dd439f86e893faf1e4cb5ef59a3730876a757
            [0003_team_member_directory.sql]=33b98ad1b6134a02b0662e9f2f03dfbd07df92a8
            [0004_next_action_mutation.sql]=7773f1c0c19efb055a42d953d08bca1dab082b85
            [0005_contracting_create.sql]=fdf8bfd1176c9c1e047b1d5fcb3512c9fab71d74
            [0006_contracting_object_mutation.sql]=f3318318720b9df270430088001ad1f6002a4728
            [0007_contracting_item_create.sql]=ddb098fe03c123b7b6cb8665890b1a2c8c12093b
            [0008_contracting_create_concurrency_repair.sql]=c91f379aef0d0922c7de3be78d798e537fef9099
            [0009_contracting_item_mutation.sql]=11f0639ae623eefb5794e69a1c7419cfd6a66fc2
            [0010_related_identifier_create.sql]=9a1dd6fec62181c506a5efad8d5518f53cf2e154
            [0011_manual_timeline_note_create.sql]=cc5d9016a5af409af8c71dd6d0f780fe5065c575
          )
          for file in "${!expected[@]}"; do
            actual="$(git hash-object "database/migrations/$file")"
            if [[ "$actual" != "${expected[$file]}" ]]; then
              echo "immutable migration changed: $file" >&2
              exit 1
            fi
          done

      - name: Red-team F47 capability preflight
        run: |
          set -euo pipefail

          createdb compras_f47_preflight_ci
          for migration in database/migrations/00{01,02,03,04,05,06,07,08,09,10,11}_*.sql; do
            PGDATABASE=compras_f47_preflight_ci psql -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE compras_contracting_responsible_mutation_owner LOGIN;"
          if PGDATABASE=compras_f47_preflight_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0012_contracting_responsible_mutation.sql; then
            echo "unsafe LOGIN F47 capability was accepted" >&2
            exit 1
          fi
          psql -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE compras_contracting_responsible_mutation_owner;"

          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE compras_contracting_responsible_mutation_owner NOLOGIN NOINHERIT BYPASSRLS;"
          if PGDATABASE=compras_f47_preflight_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0012_contracting_responsible_mutation.sql; then
            echo "unsafe BYPASSRLS F47 capability was accepted" >&2
            exit 1
          fi
          psql -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE compras_contracting_responsible_mutation_owner;"

          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE compras_contracting_responsible_mutation_owner NOLOGIN NOINHERIT NOBYPASSRLS;"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE compras_f47_preflight_member NOLOGIN;"
          psql -d postgres -v ON_ERROR_STOP=1 -c "GRANT compras_contracting_responsible_mutation_owner TO compras_f47_preflight_member WITH INHERIT FALSE, SET TRUE;"
          if PGDATABASE=compras_f47_preflight_ci psql -v ON_ERROR_STOP=1 -f database/migrations/0012_contracting_responsible_mutation.sql; then
            echo "SET-capable F47 capability membership was accepted" >&2
            exit 1
          fi
          psql -d postgres -v ON_ERROR_STOP=1 -c "REVOKE compras_contracting_responsible_mutation_owner FROM compras_f47_preflight_member;"
          psql -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE compras_f47_preflight_member;"
          psql -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE compras_contracting_responsible_mutation_owner;"

          dropdb compras_f47_preflight_ci
          for role in             compras_manual_timeline_note_create_owner             compras_related_identifier_create_owner             compras_contracting_item_mutation_owner             compras_contracting_item_create_owner             compras_contracting_object_mutation_owner             compras_contracting_create_owner             compras_next_action_mutation_owner             compras_team_directory_view_owner; do
            psql -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE $role;"
          done

      - name: Verify F47 persistent responsible mutation boundary
        run: |
          set -euo pipefail

          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE compras_f47_migrator_ci LOGIN CREATEROLE NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOREPLICATION PASSWORD 'DEMO-F47-MIGRATOR-PASSWORD';"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE compras_domain_runtime_f47_ci LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'DEMO-F47-DOMAIN-RUNTIME-PASSWORD';"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE compras_auth_runtime_f47_ci LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION;"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE compras_readonly_runtime_f47_ci LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION;"
          createdb -O compras_f47_migrator_ci compras_responsible_mutation_ci

          for migration in database/migrations/00{01,02,03,04,05,06,07,08,09,10,11,12}_*.sql; do
            PGUSER=compras_f47_migrator_ci             PGPASSWORD='DEMO-F47-MIGRATOR-PASSWORD'             PGDATABASE=compras_responsible_mutation_ci               psql -v ON_ERROR_STOP=1 -f "$migration"
          done

          FUNCTION_SIG='public.mutate_contracting_responsible(uuid,uuid,uuid,uuid)'
          test "$(PGDATABASE=compras_responsible_mutation_ci psql -Atqc "SELECT has_function_privilege('compras_domain_runtime_f47_ci','$FUNCTION_SIG','EXECUTE')")" = f
          test "$(PGDATABASE=compras_responsible_mutation_ci psql -Atqc "SELECT has_function_privilege('compras_auth_runtime_f47_ci','$FUNCTION_SIG','EXECUTE')")" = f
          test "$(PGDATABASE=compras_responsible_mutation_ci psql -Atqc "SELECT has_function_privilege('compras_readonly_runtime_f47_ci','$FUNCTION_SIG','EXECUTE')")" = f

          PGUSER=compras_f47_migrator_ci           PGPASSWORD='DEMO-F47-MIGRATOR-PASSWORD'           PGDATABASE=compras_responsible_mutation_ci             psql -v ON_ERROR_STOP=1 -v runtime_role='compras_domain_runtime_f47_ci'               -f database/provisioning/grant_contracting_responsible_mutation_runtime.sql

          test "$(PGDATABASE=compras_responsible_mutation_ci psql -Atqc "SELECT has_function_privilege('compras_domain_runtime_f47_ci','$FUNCTION_SIG','EXECUTE')")" = t
          test "$(PGDATABASE=compras_responsible_mutation_ci psql -Atqc "SELECT has_function_privilege('compras_auth_runtime_f47_ci','$FUNCTION_SIG','EXECUTE')")" = f
          test "$(PGDATABASE=compras_responsible_mutation_ci psql -Atqc "SELECT has_function_privilege('compras_readonly_runtime_f47_ci','$FUNCTION_SIG','EXECUTE')")" = f

          PGUSER=compras_f47_migrator_ci           PGPASSWORD='DEMO-F47-MIGRATOR-PASSWORD'           PGDATABASE=compras_responsible_mutation_ci           psql -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO compras_domain_runtime_f47_ci;
          GRANT SELECT ON TABLE
            public.app_users,
            public.memberships,
            public.teams,
            public.contractings,
            public.related_identifiers,
            public.contracting_items,
            public.contracting_events
            TO compras_domain_runtime_f47_ci;
          GRANT EXECUTE ON FUNCTION public.current_auth_issuer() TO compras_domain_runtime_f47_ci;
          GRANT EXECUTE ON FUNCTION public.current_auth_subject() TO compras_domain_runtime_f47_ci;
          GRANT EXECUTE ON FUNCTION public.current_app_user_id() TO compras_domain_runtime_f47_ci;
          SQL

          PGDATABASE=compras_responsible_mutation_ci             psql -v ON_ERROR_STOP=1 -f database/tests/contracting_responsible_mutation.sql

          F47_CONTRACTING_RESPONSIBLE_MUTATION_POSTGRES_TEST=1           F47_DOMAIN_RUNTIME_DATABASE_URL='postgresql://compras_domain_runtime_f47_ci:DEMO-F47-DOMAIN-RUNTIME-PASSWORD@localhost:5432/compras_responsible_mutation_ci'           F47_ADMIN_DATABASE_URL='postgresql://postgres:postgres@localhost:5432/compras_responsible_mutation_ci'             npx vitest run src/features/contracting-detail/persistent-responsible-mutation.postgres.test.ts

          dropdb compras_responsible_mutation_ci
          for role in             compras_contracting_responsible_mutation_owner             compras_manual_timeline_note_create_owner             compras_related_identifier_create_owner             compras_contracting_item_mutation_owner             compras_contracting_item_create_owner             compras_contracting_object_mutation_owner             compras_contracting_create_owner             compras_next_action_mutation_owner             compras_team_directory_view_owner             compras_domain_runtime_f47_ci             compras_auth_runtime_f47_ci             compras_readonly_runtime_f47_ci             compras_f47_migrator_ci; do
            psql -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE $role;"
          done
